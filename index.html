<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Daily Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body class="light-mode">
    <div class="container">
        <div class="header-container">
            <div class="title-container">
                <h1>Smart Daily Planner</h1>
            </div>
            <div class="switch-container">
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <div class="input-section">
            <div class="task-input-container">
                <div class="task-input">
                    <input type="text" id="task-input" placeholder="Enter your task...">
                    <div class="time-input">
                        <div class="time-selector">
                            <div class="time-box hours-box">
                                <span class="time-value" id="hours-value">00</span>
                            </div>
                            <span class="time-separator">:</span>
                            <div class="time-box minutes-box">
                                <span class="time-value" id="minutes-value">00</span>
                            </div>
                        </div>
                    </div>
                    <button id="add-task">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="recent-tasks-panel">
                <button class="recent-tasks-toggle">
                    <i class="fas fa-history"></i>
                    <span>Recent Tasks</span>
                </button>
                <div class="recent-tasks-container">
                    <div id="recent-tasks-list"></div>
                </div>
            </div>
        </div>

        <div class="tasks-container">
            <h2>Your Tasks</h2>
            <div id="tasks-list"></div>
            <div class="total-time">
                Total Time: <span id="total-hours">0</span> hours <span id="total-minutes">0</span> minutes
            </div>
        </div>

        <div class="completed-tasks-panel">
            <button class="completed-tasks-toggle">
                <i class="fas fa-check-circle"></i>
                <span>Completed Tasks</span>
            </button>
            <div class="completed-tasks-container">
                <div id="completed-tasks-list"></div>
            </div>
        </div>

        <div class="quote-container">
            <div class="dice-container">
                <i class="fas fa-dice"></i>
            </div>
            <p id="quote">Click the dice for a motivational quote!</p>
        </div>
    </div>

    <!-- Dropdown Menüler -->
    <div class="dropdown-container">
        <div class="time-dropdown hours-dropdown">
            <div class="time-option" data-value="00">00</div>
            <div class="time-option" data-value="01">01</div>
            <div class="time-option" data-value="02">02</div>
            <div class="time-option" data-value="03">03</div>
            <div class="time-option" data-value="04">04</div>
            <div class="time-option" data-value="05">05</div>
            <div class="time-option" data-value="06">06</div>
            <div class="time-option" data-value="07">07</div>
            <div class="time-option" data-value="08">08</div>
            <div class="time-option" data-value="09">09</div>
            <div class="time-option" data-value="10">10</div>
            <div class="time-option" data-value="11">11</div>
            <div class="time-option" data-value="12">12</div>
            <div class="time-option" data-value="13">13</div>
            <div class="time-option" data-value="14">14</div>
            <div class="time-option" data-value="15">15</div>
            <div class="time-option" data-value="16">16</div>
            <div class="time-option" data-value="17">17</div>
            <div class="time-option" data-value="18">18</div>
            <div class="time-option" data-value="19">19</div>
            <div class="time-option" data-value="20">20</div>
            <div class="time-option" data-value="21">21</div>
            <div class="time-option" data-value="22">22</div>
            <div class="time-option" data-value="23">23</div>
        </div>
        <div class="time-dropdown minutes-dropdown">
            <div class="time-option" data-value="00">00</div>
            <div class="time-option" data-value="05">05</div>
            <div class="time-option" data-value="10">10</div>
            <div class="time-option" data-value="15">15</div>
            <div class="time-option" data-value="20">20</div>
            <div class="time-option" data-value="25">25</div>
            <div class="time-option" data-value="30">30</div>
            <div class="time-option" data-value="35">35</div>
            <div class="time-option" data-value="40">40</div>
            <div class="time-option" data-value="45">45</div>
            <div class="time-option" data-value="50">50</div>
            <div class="time-option" data-value="55">55</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
